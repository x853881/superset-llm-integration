# Exact versions of every package the suite installs, from a clean Python 3.11
# environment. run/venv.sh installs requirements.txt held to these versions
# (pip install -r requirements.txt -c requirements.lock), so every machine
# runs the same code. To refresh: delete .venv, remove this file, run
# run/unit.sh --local, then write `.venv/bin/pip freeze` here again.
#
# One package is left out, so pip picks its version: the console-formatting
# library DeepEval depends on, whose name the plugin's publish checks refuse.
